apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-demo-api
  namespace: controlled-release-demo
  labels:
    app: sre-demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-demo-api
  template:
    metadata:
      labels:
        app: sre-demo-api
    spec:
      containers:
        - name: sre-demo-api
          image: localhost/sre-demo-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
