apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-demo-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ag-monk/argocd-sre-demo.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: controlled-release-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
